{% extends "portfolio_app/base_template.html" %}

{% block content %}
    <h2>Confirm Student Deletion</h2>
    <p>Are you sure you want to delete the student "{{ student.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'student-list' %}">Cancel</a>
    </form>
{% endblock %}
